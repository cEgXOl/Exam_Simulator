[build]
  command = "node scripts/build-functions.mjs"
  publish = "dist"
  functions = "functions-built"
[functions]
  node_bundler = "esbuild"
[[edge_functions]]
  function = "access"
  path = "/*"
[dev]
  framework = "#static"
  publish = "dist"
  port = 8888
[[redirects]]
  from = "/assets/*"
  to = "/.netlify/functions/assets?key=:splat"
  status = 200
  force = true
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    X-Content-Type-Options = "nosniff"
[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
[[headers]]
  for = "/.netlify/functions/*"
  [headers.values]
    Cache-Control = "no-store"
